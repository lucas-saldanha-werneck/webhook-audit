[project]
name = "webhook-audit"
version = "0.1.0"
description = "Audit webhook delivery logs for duplicates, ordering, gaps, bad signatures and bad retry backoff"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
webhook-audit = "webhook_audit.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
